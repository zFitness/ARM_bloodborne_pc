name: Build DroidDeck rootfs

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: 'JSON runs-on value. Default uses GitHub-hosted ARM64; use ["self-hosted","linux","arm64"] for your own runner.'
        required: true
        default: '"ubuntu-24.04-arm"'
      version:
        description: Runtime version suffix, for example r1
        required: true
        default: r1
      linuxfs_catalog_url:
        description: Optional linuxfs.json catalog URL. Leave empty for The412Banner/winlator-contents main.
        required: false
        default: ''
      release_tag:
        description: Release tag to upload rootfs files to. Leave empty to skip release upload.
        required: false
        default: 'rootfs-latest'

jobs:
  build:
    name: Build DroidDeck rootfs
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: write

    steps:
      - name: Check runner architecture
        run: |
          set -euo pipefail
          echo "Runner: $(uname -s) $(uname -m)"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl python3 zstd

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build bbport runtime
        env:
          BB_NIXPKGS: channel:nixos-unstable
        run: nix-shell -I nixpkgs=$BB_NIXPKGS shell.nix --run 'bash build.sh'

      - name: Build driverless runtime tar
        env:
          BB_NIXPKGS: channel:nixos-unstable
        run: bash packaging/runtime-tar.sh

      - name: Check runtime tar
        run: bash packaging/check-runtime-tar.sh dist/Bloodborne-bbport-runtime-aarch64.tar.gz

      - name: Build DroidDeck rootfs
        env:
          BLOODBORNE_ROOTFS_VERSION: ${{ inputs.version }}
          BBPORT_RUNTIME_TARBALL: ${{ format('{0}/dist/Bloodborne-bbport-runtime-aarch64.tar.gz', github.workspace) }}
          LINUXFS_CATALOG_URL: ${{ inputs.linuxfs_catalog_url }}
        run: bash packaging/rootfs/scripts/build-rootfs.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodborne-droid-rootfs-${{ inputs.version }}
          path: |
            dist/bloodborne-droid-rootfs-aarch64-${{ inputs.version }}.tar.zst
            dist/bloodborne-droid-rootfs-aarch64-${{ inputs.version }}.json
          if-no-files-found: error

      - name: Upload rootfs to release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE: dist/bloodborne-droid-rootfs-aarch64-${{ inputs.version }}.tar.zst
          MANIFEST: dist/bloodborne-droid-rootfs-aarch64-${{ inputs.version }}.json
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Bloodborne DroidDeck rootfs build from ${GITHUB_SHA}." \
              --prerelease
          fi
          gh release upload "$RELEASE_TAG" "$ARCHIVE" "$MANIFEST" --clobber

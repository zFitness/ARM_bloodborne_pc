name: Build Debian rootfs

# Packages the bbport runtime into a Debian 13 (trixie) ARM64 rootfs.
#
# This is the parallel path to rootfs.yml (DroidDeck). It differs in where the base comes
# from: that one downloads a prebuilt linuxfs from a third-party catalog, this one runs
# debootstrap against the Debian archive. No third-party artifact is involved, the base
# has a working apt, and the result is much smaller — see the change's design.md.
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: 'JSON runs-on value. Default uses GitHub-hosted ARM64; use ["self-hosted","linux","arm64"] for your own runner.'
        required: true
        default: '"ubuntu-24.04-arm"'
      version:
        description: Rootfs version suffix, for example r1
        required: true
        default: r1
      debian_suite:
        description: Debian suite to bootstrap
        required: true
        default: trixie
      debian_mirror:
        description: Debian mirror for debootstrap
        required: false
        default: 'http://deb.debian.org/debian'
      release_tag:
        description: Release tag to upload rootfs files to. Empty skips the upload.
        required: false
        default: ''

jobs:
  build:
    name: Build Debian rootfs
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: write

    steps:
      - name: Check runner architecture
        run: |
          set -euo pipefail
          echo "Runner: $(uname -s) $(uname -m)"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils curl python3 zstd \
            debootstrap debian-archive-keyring

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The build has two heavy phases:
      #   1. build.sh  (gcc + cmake + ninja) — NOT cached here, would need ccache.
      #   2. nix-build packaging/runtime-tar.nix — pulls / builds a closure from
      #      nixpkgs. Subsequent runs hit /nix/store and finish fast, so cache it.
      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: |
            /nix/store
            ~/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('shell.nix', 'packaging/runtime-tar.nix', 'packaging/default.nix', '.github/workflows/rootfs-debian.yml') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Build bbport runtime
        # Same first half as rootfs.yml: the Nix closure that produces the driverless
        # runtime tar. The Debian rootfs unpacks that tarball rather than carrying the
        # closure itself, which is where its size saving comes from.
        env:
          BB_NIXPKGS: channel:nixos-unstable
        run: nix-shell -I nixpkgs=$BB_NIXPKGS shell.nix --run 'bash build.sh'

      - name: Build driverless runtime tar
        env:
          BB_NIXPKGS: channel:nixos-unstable
        run: bash packaging/runtime-tar.sh

      - name: Check runtime tar
        run: bash packaging/check-runtime-tar.sh dist/Bloodborne-bbport-runtime-aarch64.tar.gz

      - name: Build Debian rootfs
        env:
          BLOODBORNE_ROOTFS_VERSION: ${{ inputs.version }}
          BB_DEBIAN_SUITE: ${{ inputs.debian_suite }}
          BB_DEBIAN_MIRROR: ${{ inputs.debian_mirror }}
          BBPORT_RUNTIME_TARBALL: ${{ format('{0}/dist/Bloodborne-bbport-runtime-aarch64.tar.gz', github.workspace) }}
        # Needs root for chroot; add-debian-extras.sh falls back to proot without it.
        # One-line run so YAML literal-block indentation does not prepend spaces to
        # the bash argument (env would then look up a program named " bash").
        run: >
          sudo -E env
          "BLOODBORNE_ROOTFS_VERSION=$BLOODBORNE_ROOTFS_VERSION"
          "BB_DEBIAN_SUITE=$BB_DEBIAN_SUITE"
          "BB_DEBIAN_MIRROR=$BB_DEBIAN_MIRROR"
          "BBPORT_RUNTIME_TARBALL=$BBPORT_RUNTIME_TARBALL"
          "WORK_DIR=${{ github.workspace }}/.work/rootfs-debian"
          "DIST_DIR=${{ github.workspace }}/dist"
          bash packaging/rootfs-debian/scripts/build-debian-rootfs.sh

      - name: Report sizes
        run: |
          set -euo pipefail
          echo "== Debian rootfs artifacts"
          ls -lh dist/bloodborne-debian-rootfs-*
          echo
          echo "For comparison, the DroidDeck path's base alone is ~754 MiB"
          echo "(The412Banner/winlator-contents linuxfs-r9). Track this number"
          echo "across builds to catch regressions in the extras package list."

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloodborne-debian-rootfs-${{ inputs.version }}
          path: |
            dist/bloodborne-debian-rootfs-aarch64-${{ inputs.version }}.tar.zst
            dist/bloodborne-debian-rootfs-aarch64-${{ inputs.version }}.json
          if-no-files-found: error

      - name: Upload rootfs to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE: dist/bloodborne-debian-rootfs-aarch64-${{ inputs.version }}.tar.zst
          MANIFEST: dist/bloodborne-debian-rootfs-aarch64-${{ inputs.version }}.json
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Bloodborne Debian rootfs build from ${GITHUB_SHA}." \
              --prerelease
          fi
          gh release upload "$RELEASE_TAG" "$ARCHIVE" "$MANIFEST" --clobber